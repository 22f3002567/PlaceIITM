{% extends "base.html" %}
{% block title %}Login - PlaceIIT{% endblock %}

{% block content %}

<h2>Sign In</h2>
<p>Welcome back to PlaceIIT</p>

<form method="POST" action="{{ url_for('login') }}">

<p><strong>Sign in as:</strong></p>

<input type="radio" name="role" id="role_student" value="student" required
{% if request.form.get('role') == 'student' %}checked{% endif %}>
<label for="role_student">Student</label>

<input type="radio" name="role" id="role_company" value="company"
{% if request.form.get('role') == 'company' %}checked{% endif %}>
<label for="role_company">Company</label>

<input type="radio" name="role" id="role_admin" value="admin"
{% if request.form.get('role') == 'admin' %}checked{% endif %}>
<label for="role_admin">Admin</label>

<br><br>

<label for="email">Email</label><br>
<input type="email" name="email" id="email"
placeholder="your@email.com"
required
value="{{ request.form.get('email', '') }}">

<br><br>

<label for="password">Password</label><br>
<input type="password" name="password" id="password"
placeholder="Enter your password"
required>

<br><br>

<button type="submit">Login</button>

</form>

<hr>

<p>
No account?
<a href="{{ url_for('reg_student') }}">Register as Student</a> |
<a href="{{ url_for('reg_company') }}">Register Company</a>
</p>

<p>
<strong>Demo admin:</strong> admin@placeiit.edu / Admin@123
</p>

{% endblock %}
